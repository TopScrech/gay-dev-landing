server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Missing files 404 instead of falling back to the SPA, so the CDN never caches HTML under an image URL
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
