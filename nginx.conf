server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep MP4 byte ranges intact through the reverse proxy and CDN for Safari playback
    location ^~ /videos/ {
        try_files $uri =404;
        gzip off;
        # An explicit encoding also prevents Traefik's compression middleware from recompressing MP4s
        add_header Content-Encoding identity;
        add_header Cache-Control "public, max-age=14400, no-transform";
    }

    # Missing files 404 instead of falling back to the SPA, so the CDN never caches HTML under an image URL
    location ~ \.[a-zA-Z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
